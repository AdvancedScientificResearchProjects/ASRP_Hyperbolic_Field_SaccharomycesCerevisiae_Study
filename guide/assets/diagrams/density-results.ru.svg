<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
<title id="t">Плотность по каналам: цикл 1 обратный</title>
<desc id="d">Слева: средний счёт клеток на поле 100×, циклы 2 и 3 вместе, сегментация cyto2: контроль 112 (n 82), CH17 205 (+83 процентов, n 112), CH19 118 (+5 процентов, n 110), CH21 88 (−21 процентов, n 94). Справа: цикл 1, только занятость, доля снимка, занятая клетками: контроль 0.141, CH17 0.189, CH19 0.134, CH21 0.246; CH21 самый плотный (+74 процентов), обратно циклам 2 и 3. CH17 первый, CH21 последний в обоих циклах со счётом.</desc>
