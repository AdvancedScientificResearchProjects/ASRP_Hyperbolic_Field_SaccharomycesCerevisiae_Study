<text x='38' y='151.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>Handwritten, three pages: photo number to channel,</text>
<text x='38' y='171.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>medium, replicate, magnification</text>
<rect x='414' y='100' width='372' height='108' rx='12' fill='#0b1430' stroke='#ffcf5c' stroke-width='1.6'/>
