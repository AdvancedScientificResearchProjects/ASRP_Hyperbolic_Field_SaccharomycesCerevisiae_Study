<title id="t">Что заявлено и что показано</title>
<desc id="d">Семь строк: тема, что говорят README или протокол, что показывают файлы, и слово-состояние. Кинетика ферментации заявлена как первичная; таких данных нет (не сделано). Направление эффекта плотности: CH17 больше клеток, CH21 меньше; показано в двух циклах, цикл 1 обратный (предварительно). Репликация: README говорит воспроизводимо; отчёт говорит пока нет (предварительно). Предрегистрация до данных: файл в репозитории добавлен 2026-06-10, после данных (спорно). Ускорение деления CH19: на этом пакете не подтверждено (не сделано). Рандомизированный слепой дизайн: ослепление только при оценке (частично). Патент: только номер заявки (заявка).</desc>
