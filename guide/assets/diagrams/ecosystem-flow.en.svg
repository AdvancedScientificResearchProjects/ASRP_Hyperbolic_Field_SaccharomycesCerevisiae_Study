<title id="t">What this study depends on</title>
<desc id="d">Centre: the yeast study. It depends on the blood plasma study for the meaning of channels 19 and 21, on the emitter programs repository for the hardware control, and on a patent application KZ 2025/1095.1 for the hardware family. Sibling studies of the same field, plants and crystals, are only listed. 6 patent applications appear in the portfolio table of the old README; none is stated as granted.</desc>
