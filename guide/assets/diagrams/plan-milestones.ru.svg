<title id="t">План вех, как его рисовал прежний README</title>
<desc id="d">Перерисовано с прежней схемы charts/mermaid/root_3.png. Восемь шагов по порядку: 28 марта команда и протокол; 29 марта модернизация излучателя 0,7 Вт до 60 Вт / 144 Вт; 31 марта валидация микроскопии и окрашивания; 4 апреля подана предрегистрация OSF; 7 апреля регистрация OSF принята; 2 кв. 2026 начало экспериментов по облучению; 3-4 кв. 2026 сбор данных и CV-анализ; 3-4 кв. 2026 подготовка публикации.</desc>
