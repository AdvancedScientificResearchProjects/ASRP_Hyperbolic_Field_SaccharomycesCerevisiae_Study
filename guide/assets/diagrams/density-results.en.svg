<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
<title id="t">Cell density by channel: two cycles agree, cycle 1 reverses</title>
<desc id="d">Left: mean cell count per 100x field, cycles 2 and 3 pooled, cyto2 segmentation: control 112 (n 82), CH17 205 (+83 percent, n 112), CH19 118 (+5 percent, n 110), CH21 88 (−21 percent, n 94). Right: cycle 1, occupancy only, the fraction of the image covered by cells: control 0.141, CH17 0.189, CH19 0.134, CH21 0.246; CH21 is the densest (+74 percent), the opposite of cycles 2 and 3. CH17 ranks first and CH21 last in both cycles that have counts.</desc>
