<title id="t">Связь с патентом, как её рисовал прежний README</title>
<desc id="d">Перерисовано с прежней схемы charts/mermaid/retry_1.png. Заявка KZ 2025/1095.1, Fractal Biomedical Hyperbolic Field System, статус Substantive Exam, ведёт к технологии излучателей гиперболического поля, а она к четырём исследованиям: это исследование (Saccharomyces cerevisiae), исследование плазмы, сельскохозяйственное и исследование кристаллов DAAT.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1200' height='510' rx='18' fill='url(#bg)'/>

