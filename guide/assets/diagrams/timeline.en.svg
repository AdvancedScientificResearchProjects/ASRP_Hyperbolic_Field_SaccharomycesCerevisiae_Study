<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" role="img" aria-labelledby="t d">
<title id="t">Plan versus what the repository records</title>
<desc id="d">Two lanes of eight events, in order, not to scale. Lane one, the plan drawn in the old README: Mar 28 Team assembled, protocol defined; Mar 29 Emitter upgrade 0.7 W to 60 W / 144 W; Mar 31 Microscopy and staining validated; Apr 4 OSF preregistration submitted; Apr 7 OSF registration accepted; Q2 2026 Irradiation experiments begin; Q3–Q4 2026 Data collection and CV analysis; Q3–Q4 2026 Publication preparation. Lane two, what the repository records: 2026-03-28 Repository created (first commit); 2026-04-04 OSF project osf.io/vxkum registered; 2026-04-19 First photos observed (198 dated, to 2026-04-22); 2026-05-06 Photo hub and manifest added to the repository; 2026-06-09 Density report v2: preliminary signal; 2026-06-10 Preregistration file first committed, results already in it; 2026-07-18 Last change: README aligned to the house template; 2026-11-19 Showcase restructuring (this change).</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
