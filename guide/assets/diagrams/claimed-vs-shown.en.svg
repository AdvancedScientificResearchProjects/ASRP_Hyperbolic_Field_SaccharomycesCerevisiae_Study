<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 836" width="1200" height="836" role="img" aria-labelledby="t d">
<title id="t">What is claimed and what was shown</title>
<desc id="d">Seven rows: topic, what the README or protocol says, what the files show, and a state word. Fermentation kinetics claimed as primary; no such data (not done). Direction of the density effect: CH17 more cells, CH21 fewer; shown in two cycles, cycle 1 reverses (preliminary). Replication: README says reproducible; the report says not yet (preliminary). Preregistered before data: the in-repository file was added on 2026-06-10, after the data (disputed). CH19 faster division: not supported on this batch (not shown). Blinded randomised design: blinding at scoring only (partly). Patent: an application number only (application).</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1200' height='836' rx='18' fill='url(#bg)'/>

