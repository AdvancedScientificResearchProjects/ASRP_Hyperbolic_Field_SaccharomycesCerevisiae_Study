<desc id="d">Две дорожки по восемь событий, по порядку, без масштаба. Первая, план со схемы прежнего README: Mar 28 Команда собрана, протокол определён; Mar 29 Модернизация излучателя 0,7 Вт до 60 / 144 Вт; Mar 31 Микроскопия и окрашивание валидированы; Apr 4 OSF: предрегистрация подана; Apr 7 Регистрация OSF принята; Q2 2026 Начало экспериментов по облучению; Q3–Q4 2026 Сбор данных и CV-анализ; Q3–Q4 2026 Подготовка публикации. Вторая, что записано в репозитории: 2026-03-28 Репозиторий создан (первый коммит); 2026-04-04 OSF: проект osf.io/vxkum; 2026-04-19 Первые снимки (198 с датой, до 2026-04-22); 2026-05-06 В репозиторий добавлен хаб фото и манифест; 2026-06-09 Отчёт v2 по плотности: лишь сигнал; 2026-06-10 Файл предрегистрации впервые закоммичен, результаты уже в нём; 2026-07-18 Последнее изменение: README по шаблону дома; 2026-11-19 Новая структура README (это изменение).</desc>
