<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
<title id="t">От рукописного журнала до отчёта</title>
<desc id="d">Слева направо: рукописный лабораторный журнал, переписанный в journal-mapping.csv (81 строк, 967 снимков, 3 цикла); набор фото (990 файлов, 972 HEIC и 18 PNG); затем три метода без метки канала: счёт клеток cyto2 на 398 полях, занятость текстуры на 972 полях и слепая оценка LLM 920 полей; канал присоединяется только при агрегации; на выходе один отчёт.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1200' height='640' rx='18' fill='url(#bg)'/>

<text x='24' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='26' fill='#e6ecff' text-anchor='start' font-weight='700'>От рукописного журнала до отчёта</text>
<text x='24' y='72' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#8ea0d6' text-anchor='start' font-weight='400'>Канал каждого снимка известен из рукописного журнала</text>
<text x='1176' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#4ecdc4' text-anchor='end' font-weight='700' letter-spacing='2'>ПОТОК АНАЛИЗА</text>
<rect x='24' y='100' width='372' height='108' rx='12' fill='#0b1430' stroke='#ffcf5c' stroke-width='1.6'/>
<text x='38' y='131.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='15' fill='#e6ecff' text-anchor='start' font-weight='700'>Лабораторный журнал</text>
<text x='38' y='151.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>Рукописный, три страницы: номер снимка в</text>
<text x='38' y='171.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>канал, среду, повтор, увеличение</text>
<rect x='414' y='100' width='372' height='108' rx='12' fill='#0b1430' stroke='#ffcf5c' stroke-width='1.6'/>
<text x='428' y='131.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='15' fill='#e6ecff' text-anchor='start' font-weight='700'>CSV-сопоставление</text>
<text x='428' y='151.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>81 строк, 967 снимков, 3 цикла</text>
<text x='428' y='171.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>уверенность: 72 высокая, 6 средняя, 3 низкая</text>
<rect x='804' y='100' width='372' height='108' rx='12' fill='#0b1430' stroke='#4ecdc4' stroke-width='1.6'/>
<text x='818' y='131.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='15' fill='#e6ecff' text-anchor='start' font-weight='700'>Набор фото</text>
<text x='818' y='151.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>990 файлов: 972 HEIC и 18 PNG</text>
