<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d">
<title id="t">Registered programme and the one analysed batch</title>
<desc id="d">Three cards. Fermentation kinetics: the registered primary programme (gas production, turbidity and time to onset, indices FAI, FDI, FPI), no data in the repository, not done. Viability stain: methylene blue protocol registered; the first batch used no stain, pending. Density imaging: 990 microscopy images in 3 cycles, cell count and occupancy by channel, analysed and preliminary. Below, the registered design: 11 hypotheses, groups control, CH19, CH21, CH17 and CH17+CH19; the data holds four of the five groups.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1200' height='520' rx='18' fill='url(#bg)'/>

