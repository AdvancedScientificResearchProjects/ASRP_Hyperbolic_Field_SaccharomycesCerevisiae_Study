<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" role="img" aria-labelledby="t d">
<title id="t">Планируемый стек анализа</title>
<desc id="d">Перерисовано с прежней схемы charts/mermaid/root_2.png. Снимок с камеры телефона восстанавливается Cellpose3, затем выбор типа изображения разводит потоки. Микроскопия идёт в сегментацию клеток YeastSAM и морфометрию (размер, индекс почкования). Макро чашки Петри идёт в мутность и колонии OpenCV, затем CIELAB в OD600 и жизнеспособность HSV. Обе ветви ведут к кривым роста AMiGA, затем к статистике LME и ANOVA и к результатам.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1200' height='690' rx='18' fill='url(#bg)'/>

<text x='24' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='26' fill='#e6ecff' text-anchor='start' font-weight='700'>Планируемый стек анализа</text>
<text x='24' y='72' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#8ea0d6' text-anchor='start' font-weight='400'>Прежняя схема, перерисована; это план, а не проанализированная серия</text>
