<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" role="img" aria-labelledby="t d">
<title id="t">Planned analysis stack</title>
<desc id="d">Redrawn from the earlier diagram charts/mermaid/root_2.png. A phone camera image is restored with Cellpose3, then an image-type decision splits it. Microscopy goes to YeastSAM cell segmentation and morphometry (size, budding index). A macro Petri dish goes to OpenCV turbidity and colony measurement, then CIELAB to OD600 and HSV viability. Both branches feed AMiGA growth curves, then LME and ANOVA statistics, then results.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1200' height='690' rx='18' fill='url(#bg)'/>

