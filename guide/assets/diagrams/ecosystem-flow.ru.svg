<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="t d">
<title id="t">От чего зависит это исследование</title>
<desc id="d">В центре исследование дрожжей. Оно зависит от исследования плазмы крови в смысле каналов 19 и 21, от репозитория программ излучателей в части управления аппаратурой и от патентной заявки KZ 2025/1095.1 по аппаратному семейству. Смежные исследования того же поля, растения и кристаллы, только перечислены. В таблице портфеля прежнего README 6 патентных заявок; ни одна не названа выданной.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1200' height='460' rx='18' fill='url(#bg)'/>

<text x='24' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='26' fill='#e6ecff' text-anchor='start' font-weight='700'>От чего зависит это исследование</text>
<text x='24' y='72' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#8ea0d6' text-anchor='start' font-weight='400'>Зависимости как указано в этом репозитории, вне его не проверены</text>
<text x='1176' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#4ecdc4' text-anchor='end' font-weight='700' letter-spacing='2'>ЭКОСИСТЕМА</text>
<rect x='430.0' y='190' width='340' height='130' rx='12' fill='#0b1430' stroke='#ffcf5c' stroke-width='1.6'/>
<text x='444.0' y='221.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='15' fill='#e6ecff' text-anchor='start' font-weight='700'>Исследование дрожжей</text>
<text x='444.0' y='241.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>этот репозиторий</text>
<text x='444.0' y='261.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>990 снимков, 3 цикла</text>
<text x='444.0' y='282.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#ffcf5c' text-anchor='start' font-weight='800'>◧ ПРЕДВАРИТЕЛЬНО</text>
<rect x='24' y='100' width='380' height='130' rx='12' fill='#0b1430' stroke='#a78bfa' stroke-width='1.6'/>
<text x='38' y='131.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='15' fill='#e6ecff' text-anchor='start' font-weight='700'>Исследование плазмы крови</text>
<text x='38' y='151.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>Источник гипотез направления CH19 и CH21</text>
<text x='38' y='171.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>osf.io/8q42f</text>
<defs><marker id='ma78bfa' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10z' fill='#a78bfa'/></marker></defs>
<path d='M407.0,165.0 L427.0,235.0' fill='none' stroke='#a78bfa' stroke-width='2' marker-end='url(#ma78bfa)'></path>
<rect x='24' y='270' width='380' height='130' rx='12' fill='#0b1430' stroke='#4ecdc4' stroke-width='1.6'/>
<text x='38' y='301.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='15' fill='#e6ecff' text-anchor='start' font-weight='700'>Программы излучателей</text>
<text x='38' y='321.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>ПО управления излучателями</text>
<text x='38' y='341.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>это исследование логирует только</text>
<text x='38' y='361.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>идентификаторы каналов</text>
<defs><marker id='m4ecdc4' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10z' fill='#4ecdc4'/></marker></defs>
<path d='M407.0,335.0 L427.0,275.0' fill='none' stroke='#4ecdc4' stroke-width='2' marker-end='url(#m4ecdc4)'></path>
<rect x='796' y='100' width='380' height='130' rx='12' fill='#0b1430' stroke='#ffa657' stroke-width='1.6'/>
<text x='810' y='131.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='15' fill='#e6ecff' text-anchor='start' font-weight='700'>Патентная заявка</text>
<text x='810' y='151.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>KZ 2025/1095.1, экспертиза по существу</text>
<text x='810' y='171.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>то же аппаратное семейство; не выданный патент</text>
<defs><marker id='mffa657' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10z' fill='#ffa657'/></marker></defs>
<path d='M793.0,165.0 L773.0,235.0' fill='none' stroke='#ffa657' stroke-width='2' marker-end='url(#mffa657)'></path>
<rect x='796' y='270' width='380' height='130' rx='12' fill='#0b1430' stroke='#8ea0d6' stroke-width='1.6'/>
<text x='810' y='301.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='15' fill='#e6ecff' text-anchor='start' font-weight='700'>Смежные исследования</text>
<text x='810' y='321.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>Сельскохозяйственное (растения, семена) и</text>
<text x='810' y='341.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>кристаллов</text>
<text x='810' y='361.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>только перечислены, ничего не импортируется</text>
<defs><marker id='m8ea0d6' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10z' fill='#8ea0d6'/></marker></defs>
<path d='M773.0,275.0 L793.0,335.0' fill='none' stroke='#8ea0d6' stroke-width='2' stroke-dasharray='7 6' marker-end='url(#m8ea0d6)'></path>
<text x='24' y='426' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>По решению владельца заявители физические лица; компания только</text>
<text x='24' y='446' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>адрес для переписки.</text>
</svg>
