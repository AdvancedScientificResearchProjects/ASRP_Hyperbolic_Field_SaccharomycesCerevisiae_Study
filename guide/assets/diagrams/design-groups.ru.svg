<title id="t">Группы воздействия и контроль по плану</title>
<desc id="d">Перерисовано с прежней схемы charts/mermaid/root_1.png. Четыре группы воздействия, CH17, CH19, CH21 и CH17+CH19, и одна контрольная группа, в каждой заявлено 5-10 образцов, ведут к измерениям и затем к результатам.</desc>
