<title id="t">Milestone plan as the earlier README drew it</title>
<desc id="d">Redrawn from the earlier diagram charts/mermaid/root_3.png. Eight steps in order: Mar 28 team assembled and protocol defined; Mar 29 emitter upgrade 0.7 W to 60 W / 144 W; Mar 31 microscopy and staining validated; Apr 4 OSF preregistration submitted; Apr 7 OSF registration accepted; Q2 2026 irradiation experiments begin; Q3-Q4 2026 data collection and CV analysis; Q3-Q4 2026 publication preparation.</desc>
