<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="t d">
<title id="t">Гиперболическое поле × дрожжи</title>
<desc id="d">Сгенерированная иллюстрация, не скриншот. Слева четыре столбца: средний счёт клеток на поле микроскопа 100× в циклах 2 и 3 (контроль 112, канал 17 205, канал 19 118, канал 21 88), предварительный результат по плотности. Справа заголовок, вопрос в одну строку и три числа, посчитанные по репозиторию: 990 снимков микроскопии, 3 цикла эксперимента, 11 зарегистрированных гипотез.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1200' height='330' rx='18' fill='url(#bg)'/>

<text x='40' y='50' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#4ecdc4' text-anchor='start' font-weight='700'>средний счёт клеток на поле 100×, циклы 2–3</text>
<line x1='44' y1='250' x2='456' y2='250' stroke='#2a3b78' stroke-width='1.5'/>
<rect x='50.0' y='161.4' width='86.5' height='88.6' rx='6' fill='#8ea0d6' fill-opacity='0.85'/>
<text x='93.2' y='153.4' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='15' fill='#e6ecff' text-anchor='middle' font-weight='700'>112</text>
<text x='93.2' y='272' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='middle' font-weight='600'>CH0</text>
<rect x='154.5' y='87.9' width='86.5' height='162.1' rx='6' fill='#4ecdc4' fill-opacity='0.85'/>
<text x='197.8' y='79.9' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='15' fill='#e6ecff' text-anchor='middle' font-weight='700'>205</text>
<text x='197.8' y='272' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='middle' font-weight='600'>CH17</text>
<rect x='259.0' y='156.7' width='86.5' height='93.3' rx='6' fill='#a78bfa' fill-opacity='0.85'/>
<text x='302.2' y='148.7' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='15' fill='#e6ecff' text-anchor='middle' font-weight='700'>118</text>
<text x='302.2' y='272' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='middle' font-weight='600'>CH19</text>
<rect x='363.5' y='180.4' width='86.5' height='69.6' rx='6' fill='#ffa657' fill-opacity='0.85'/>
<text x='406.8' y='172.4' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='15' fill='#e6ecff' text-anchor='middle' font-weight='700'>88</text>
<text x='406.8' y='272' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='middle' font-weight='600'>CH21</text>
<text x='520' y='86' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#4ecdc4' text-anchor='start' font-weight='700' letter-spacing='2'>ИССЛЕДОВАНИЕ SACCHAROMYCES CEREVISIAE</text>
<text x='1164' y='36' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='end' font-weight='700' letter-spacing='2'>ПРИВАТНЫЙ РЕПО · РЕЗУЛЬТАТЫ ПРЕДВАРИТЕЛЬНЫЕ</text>
<text x='520' y='146' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='32' fill='#e6ecff' text-anchor='start' font-weight='800'>Гиперболическое поле × дрожжи</text>
<text x='520' y='188' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='21' fill='#8ea0d6' text-anchor='start' font-weight='400'>Меняет ли структурированное поле деление</text>
<text x='520' y='216' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='21' fill='#8ea0d6' text-anchor='start' font-weight='400'>дрожжей? Пока один пакет снимков</text>
<rect x='520.0' y='252' width='130.5' height='38' rx='19' fill='#ffcf5c' fill-opacity='0.08' stroke='#ffcf5c'/>
<text x='585.2' y='277' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#e6ecff' text-anchor='middle' font-weight='700'>990 снимков</text>
<rect x='662.5' y='252' width='204.5' height='38' rx='19' fill='#4ecdc4' fill-opacity='0.08' stroke='#4ecdc4'/>
<text x='764.7' y='277' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#e6ecff' text-anchor='middle' font-weight='700'>3 цикла эксперимента</text>
<rect x='878.9' y='252' width='115.8' height='38' rx='19' fill='#34d399' fill-opacity='0.08' stroke='#34d399'/>
<text x='936.8' y='277' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#e6ecff' text-anchor='middle' font-weight='700'>11 гипотез</text>
<text x='24' y='316' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>первый проанализированный пакет; кинетика ферментации ещё не измерена</text>
</svg>
